name: CI

on:
    push:
    pull_request:

jobs:
    phpunit:
        name: phpunit (PHP ${{ matrix.php }}, PHPUnit ${{ matrix.phpunit }}, Symfony ${{ matrix.symfony }})
        runs-on: ubuntu-22.04
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   php: '7.2'
                        phpunit: '8.5'
                        symfony: '4.4.*'
                    -   php: '7.2'
                        phpunit: '8.5'
                        symfony: '5.4.*'
                    -   php: '7.3'
                        phpunit: '9.5'
                        symfony: '4.4.*'
                    -   php: '7.3'
                        phpunit: '9.5'
                        symfony: '5.4.*'
                    -   php: '7.4'
                        phpunit: '9.5'
                        symfony: '4.4.*'
                    -   php: '7.4'
                        phpunit: '9.5'
                        symfony: '5.4.*'
                    -   php: '8.0'
                        phpunit: '9.5'
                        symfony: '4.4.*'
                    -   php: '8.0'
                        phpunit: '9.5'
                        symfony: '5.4.*'
                    -   php: '8.0'
                        phpunit: '9.5'
                        symfony: '6.0.*'
                    -   php: '8.1'
                        phpunit: '9.5'
                        symfony: '4.4.*'
                    -   php: '8.1'
                        phpunit: '9.5'
                        symfony: '5.4.*'
                    -   php: '8.1'
                        phpunit: '9.5'
                        symfony: '6.0.*'
                    -   php: '8.2'
                        phpunit: '10.0'
                        symfony: '7.0.*'
                    -   php: '8.4'
                        phpunit: '10.0'
                        symfony: '8.0.*'
        steps:
            -   uses: actions/checkout@v4

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    tools: 'composer:v2,flex'

            -   name: Cache Composer dependencies
                uses: actions/cache@v4
                with:
                    path: '~/.composer/cache'
                    key: ${{ runner.os }}-php${{ matrix.php }}-phpunit${{ matrix.phpunit }}-symfony${{ matrix.symfony }}-${{ hashFiles('**/composer.json') }}

            -   name: Install dependencies with composer
                env:
                    SYMFONY_REQUIRE: ${{ matrix.symfony }}
                run: |
                    if [[ "$SYMFONY_REQUIRE" == 4.4.* || "$SYMFONY_REQUIRE" == 5.4.* ]]; then
                        composer update --no-interaction --no-progress --no-audit
                    else
                        composer update --no-interaction --no-progress
                    fi

            -   name: Run test suite
                uses: php-actions/phpunit@v3
                with:
                    php_version: ${{ matrix.php }}
                    version: ${{ matrix.phpunit }}
